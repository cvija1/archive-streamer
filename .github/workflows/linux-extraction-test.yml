name: Linux ext4 Extraction Test

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  linux-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install native dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            cmake \
            pkg-config \
            libxml2-dev \
            libb2-dev \
            libbz2-dev \
            zlib1g-dev \
            liblzma-dev \
            libzstd-dev \
            liblz4-dev \
            libssl-dev \
            libacl1-dev \
            libattr1-dev

      - name: Build CLI
        run: cargo build --release --bin archive-streamer-cli

      - name: Create ext4 test volume
        shell: bash
        run: |
          set -euo pipefail

          IMAGE="$RUNNER_TEMP/archive-test.img"
          MOUNT="$RUNNER_TEMP/linux-volume"

          mkdir -p "$MOUNT"
          truncate -s 160M "$IMAGE"
          sudo mkfs.ext4 -F -m 0 "$IMAGE"
          sudo mount -o loop "$IMAGE" "$MOUNT"
          sudo chown "$(id -u):$(id -g)" "$MOUNT"

          df -h "$MOUNT"

          echo "IMAGE=$IMAGE" >> "$GITHUB_ENV"
          echo "MOUNT=$MOUNT" >> "$GITHUB_ENV"

      - name: Create constrained-space test
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          import hashlib
          import os
          import shutil
          import zipfile

          mount = os.environ["MOUNT"]
          temp = os.environ["RUNNER_TEMP"]

          source = os.path.join(temp, "payload.bin")
          archive = os.path.join(mount, "payload.zip")
          filler = os.path.join(mount, "filler.bin")

          # 50 MiB random data + 5 MiB zeros.
          with open(source, "wb") as f:
              for _ in range(50):
                  f.write(os.urandom(1024 * 1024))
              f.write(bytes(5 * 1024 * 1024))

          expected_size = os.path.getsize(source)

          with open(source, "rb") as f:
              expected_hash = hashlib.sha256(f.read()).hexdigest()

          with zipfile.ZipFile(
              archive,
              "w",
              compression=zipfile.ZIP_DEFLATED,
              compresslevel=1,
          ) as z:
              z.write(source, "payload.bin")

          archive_size = os.path.getsize(archive)
          print(f"Archive size: {archive_size / 1048576:.2f} MiB")
          print(f"Expanded size: {expected_size / 1048576:.2f} MiB")

          # Leave approximately 60 MiB available.
          target_free = 60 * 1024 * 1024
          chunk_size = 256 * 1024

          with open(filler, "wb") as f:
              while shutil.disk_usage(mount).free > target_free + chunk_size:
                  f.write(os.urandom(chunk_size))
                  f.flush()

          free_bytes = shutil.disk_usage(mount).free
          print(f"Free space before extraction: {free_bytes / 1048576:.2f} MiB")

          with open(os.path.join(temp, "expected.sha256"), "w") as f:
              f.write(expected_hash)

          with open(os.path.join(temp, "expected.size"), "w") as f:
              f.write(str(expected_size))

          if archive_size < 48 * 1024 * 1024:
              raise SystemExit("INVALID TEST: archive unexpectedly small")

          if free_bytes < expected_size:
              raise SystemExit(
                  "INVALID TEST: available space is smaller than output size"
              )

          if free_bytes >= archive_size + expected_size:
              raise SystemExit(
                  "INVALID TEST: enough space for archive plus extracted file"
              )
          PY

      - name: Run Archive Streamer
        shell: bash
        run: |
          set -euo pipefail

          ./target/release/archive-streamer-cli \
            "$MOUNT/payload.zip" \
            "$MOUNT/output"

          test -f "$MOUNT/output/payload.bin"

          python3 - <<'PY'
          import hashlib
          import os

          mount = os.environ["MOUNT"]
          temp = os.environ["RUNNER_TEMP"]
          output = os.path.join(mount, "output", "payload.bin")

          with open(os.path.join(temp, "expected.size")) as f:
              expected_size = int(f.read())

          with open(output, "rb") as f:
              actual_hash = hashlib.sha256(f.read()).hexdigest()

          with open(os.path.join(temp, "expected.sha256")) as f:
              expected_hash = f.read().strip()

          actual_size = os.path.getsize(output)

          assert actual_size == expected_size, (
              f"Wrong output size: {actual_size}, expected {expected_size}"
          )
          assert actual_hash == expected_hash, "Extracted content mismatch"

          print("PASS: extracted size and SHA-256 are correct")
          print("PASS: extraction succeeded under constrained disk space")
          PY

      - name: Detach ext4 test volume
        if: always()
        shell: bash
        run: |
          if [ -n "${MOUNT:-}" ]; then
            sudo umount "$MOUNT" || true
          fi