
name: Test macOS Release Binaries

on:
  workflow_dispatch:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
            asset: archive-streamer-macos-arm64.zip
            sha256: 93e84f028d306d35dedad6560fa57fb1a65bc12468116d386bc8bbbcd484b023

          - runner: macos-15-intel
            arch: x86_64
            asset: archive-streamer-macos-x86_64.zip
            sha256: ba5c879abdb870c496204d235c2a90678ebe8cb3b17c6e31ca8a1ec711feba67

    runs-on: ${{ matrix.runner }}

    steps:
      - name: Download release
        env:
          ASSET: ${{ matrix.asset }}
        run: |
          curl -fL \
            "https://github.com/cvija1/archive-streamer/releases/download/v1.0.0/$ASSET" \
            -o release.zip

      - name: Verify checksum
        env:
          EXPECTED: ${{ matrix.sha256 }}
        run: |
          echo "$EXPECTED  release.zip" | shasum -a 256 -c -

      - name: Extract release package
        run: |
          mkdir package
          ditto -x -k release.zip package
          find package -type f

      - name: Find CLI binary
        run: |
          CLI="$(find package -type f -name 'archive-streamer-cli' -print -quit)"
          test -n "$CLI"
          chmod +x "$CLI"
          echo "CLI_PATH=$CLI" >> "$GITHUB_ENV"

      - name: Check binary architecture and dependencies
        run: |
          file "$CLI_PATH"
          otool -L "$CLI_PATH"

      - name: Create test archive
        run: |
          mkdir test-work
          cd test-work

          printf 'Archive Streamer macOS extraction test\n' > expected.txt
          zip -j test-input.zip expected.txt

          mkdir output

      - name: Run actual extraction
        run: |
          cd test-work
          "$CLI_PATH" "$PWD/test-input.zip" "$PWD/output"

      - name: Verify extracted contents
        run: |
          test -f test-work/output/expected.txt
          diff test-work/expected.txt test-work/output/expected.txt
          echo "SUCCESS: extraction and content verification passed"
