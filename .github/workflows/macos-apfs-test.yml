name: macOS APFS Extraction Test

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  apfs-test:
    runs-on: macos-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build CLI
        run: cargo build --release --bin archive-streamer-cli

      - name: Build GUI
        run: cargo build --release --features gui --bin archive-streamer-gui

      - name: Create APFS test volume
        shell: bash
        run: |
          set -euo pipefail

          IMAGE="$RUNNER_TEMP/archive-test.sparseimage"
          MOUNT="$RUNNER_TEMP/apfs-volume"

          mkdir -p "$MOUNT"

          hdiutil create \
            -size 128m \
            -type SPARSE \
            -fs APFS \
            -volname ArchiveStreamerTest \
            -ov "$IMAGE"

          hdiutil attach "$IMAGE" \
            -nobrowse \
            -mountpoint "$MOUNT"

          diskutil info "$MOUNT"

          echo "IMAGE=$IMAGE" >> "$GITHUB_ENV"
          echo "MOUNT=$MOUNT" >> "$GITHUB_ENV"

      - name: Create constrained-space test
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          import hashlib
          import os
          import shutil
          import zipfile

          mount = os.environ["MOUNT"]
          temp = os.environ["RUNNER_TEMP"]

          source = os.path.join(temp, "payload.bin")
          archive = os.path.join(mount, "payload.zip")
          filler = os.path.join(mount, "filler.bin")

          # 50 MiB incompressible data + 5 MiB zeros.
          with open(source, "wb") as f:
              for _ in range(50):
                  f.write(os.urandom(1024 * 1024))
              f.write(bytes(5 * 1024 * 1024))

          expected_hash = hashlib.sha256(
              open(source, "rb").read()
          ).hexdigest()

          with zipfile.ZipFile(
              archive, "w",
              compression=zipfile.ZIP_DEFLATED,
              compresslevel=1
          ) as z:
              z.write(source, "payload.bin")

          archive_size = os.path.getsize(archive)
          print(f"Archive size: {archive_size / 1048576:.2f} MiB")
          print(f"Expanded size: {os.path.getsize(source) / 1048576:.2f} MiB")

          # Leave less free space than the expanded file needs.
          target_free = 48 * 1024 * 1024

          with open(filler, "wb") as f:
              while shutil.disk_usage(mount).free > target_free:
                  f.write(os.urandom(1024 * 1024))
                  f.flush()

          usage = shutil.disk_usage(mount)
          print(f"Free space before extraction: {usage.free / 1048576:.2f} MiB")

          with open(os.path.join(temp, "expected.sha256"), "w") as f:
              f.write(expected_hash)

          if archive_size < 48 * 1024 * 1024:
              raise SystemExit("INVALID TEST: archive unexpectedly small")

          if usage.free >= 55 * 1024 * 1024:
              raise SystemExit("INVALID TEST: insufficient disk pressure")

          PY

      - name: Run Archive Streamer
        shell: bash
        run: |
          set -euo pipefail

          ./target/release/archive-streamer-cli \
            "$MOUNT/payload.zip" \
            "$MOUNT/output"

          test -f "$MOUNT/output/payload.bin"

          python3 - <<'PY'
          import hashlib
          import os

          mount = os.environ["MOUNT"]
          temp = os.environ["RUNNER_TEMP"]
          output = os.path.join(mount, "output", "payload.bin")

          expected_size = 55 * 1024 * 1024
          actual_size = os.path.getsize(output)

          with open(output, "rb") as f:
              actual_hash = hashlib.sha256(f.read()).hexdigest()

          with open(os.path.join(temp, "expected.sha256")) as f:
              expected_hash = f.read().strip()

          assert actual_size == expected_size, (
              f"Wrong output size: {actual_size}"
          )
          assert actual_hash == expected_hash, "Extracted content mismatch"

          print("PASS: extracted size and SHA-256 are correct")
          PY

      - name: Detach APFS volume
        if: always()
        shell: bash
        run: |
          if [ -n "${MOUNT:-}" ]; then
            hdiutil detach "$MOUNT" -force || true
          fi