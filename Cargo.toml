[package]
name = "archive-streamer"
version = "0.1.0"
edition = "2024"

[features]
default = []
gui = ["dep:eframe", "dep:rfd", "dep:egui_extras"]

[[bin]]
name = "archive-streamer-cli"
path = "src/bin/cli.rs"

[[bin]]
name = "archive-streamer-gui"
path = "src/bin/gui.rs"
required-features = ["gui"]

[dependencies]
egui_extras = { version = "0.37.0", features = ["image"], optional = true }
eframe = { version = "0.37.0", optional = true }
rfd = { version = "0.17.2", optional = true }
libarchive2 = "0.2.1"


# Za Linux punch hole
[target.'cfg(target_os = "linux")'.dependencies]
nix = { version = "0.29", features = ["fs"] }

# Za macOS
[target.'cfg(target_os = "macos")'.dependencies]
libc = "0.2"

# Za Windows
[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
    "Win32_Foundation",
    "Win32_System_Ioctl",
] }


